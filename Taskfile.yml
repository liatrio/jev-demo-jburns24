# https://taskfile.dev
version: "3"

dotenv: [".env"]

vars:
  PY: uv run

tasks:
  default:
    cmds: [task --list]
    silent: true

  setup:
    desc: Create the venv and install the package with dev extras
    cmds:
      - uv venv --allow-existing
      - uv pip install -e ".[dev]"
    sources: [pyproject.toml]
    generates: [.venv/pyvenv.cfg]

  lint:
    desc: Ruff lint + format check
    deps: [setup]
    cmds:
      - "{{.PY}} ruff check ."
      - "{{.PY}} ruff format --check ."

  fmt:
    desc: Auto-fix lint and format
    deps: [setup]
    cmds:
      - "{{.PY}} ruff check . --fix"
      - "{{.PY}} ruff format ."

  tapes:generate:
    desc: Regenerate tapes/*.json from the seeded generators (idempotent)
    deps: [setup]
    cmds: ["{{.PY}} jev-demo generate-tapes"]

  tapes:list:
    desc: Show every tape and the situation it encodes
    deps: [setup]
    cmds: ["{{.PY}} jev-demo tapes"]

  test:unit:
    desc: Fast offline unit tests (no cassettes, no network)
    deps: [setup]
    cmds: ["{{.PY}} pytest tests/unit -q"]

  test:e2e:
    desc: Deterministic e2e suite - Jev-driven, replayed from tests/cassettes, no network
    deps: [setup]
    env:
      JEV_DEMO_MODE: replay
    cmds: ["{{.PY}} pytest tests/e2e -q {{.CLI_ARGS}}"]

  test:
    desc: Everything that runs offline (what pre-commit runs; the pre-push swarm is `task swarm`)
    cmds:
      - task: lint
      - task: test:unit
      - task: test:e2e

  e2e:record:
    desc: Fill in missing cassettes from the live gateway (needs API_KEY). Existing cassettes are kept.
    deps: [setup]
    preconditions:
      - sh: test -n "$API_KEY"
        msg: "API_KEY must be set (Vercel AI Gateway key)"
    env:
      JEV_DEMO_MODE: record
    cmds:
      - "{{.PY}} jev-demo play-all -e jev,sonnet,gpt,hybrid --quiet"
      - "{{.PY}} pytest tests/e2e -q"

  e2e:rerecord:
    desc: Delete all cassettes and record fresh ones (needs API_KEY, makes paid calls)
    prompt: This deletes tests/cassettes and re-records every request. Continue?
    cmds:
      - rm -rf tests/cassettes
      - task: e2e:record

  test:live:
    desc: Run the e2e suite against the live gateway, bypassing cassettes (needs API_KEY)
    deps: [setup]
    env:
      JEV_DEMO_MODE: live
    cmds: ["{{.PY}} pytest tests/e2e -q -m 'e2e or live'"]

  play:
    desc: "Play one tape: task play -- T01 [--evaluators jev,sonnet,gpt,hybrid] [--mode live]"
    deps: [setup]
    cmds: ["{{.PY}} jev-demo play {{.CLI_ARGS}}"]

  play:all:
    desc: Play every tape and print the pooled comparison (replays cassettes when present)
    deps: [setup]
    cmds: ["{{.PY}} jev-demo play-all {{.CLI_ARGS}}"]

  demo:
    desc: Live demo run of all tapes with all evaluators, ignoring cassettes (needs API_KEY)
    deps: [setup]
    env:
      JEV_DEMO_MODE: live
    cmds: ["{{.PY}} jev-demo play-all -e jev,sonnet,gpt --no-save"]

  pii:check:
    desc: "Semantic lint: ask Jev whether any log statement in the given files leaks PII. task pii:check -- src/**/*.py"
    deps: [setup]
    cmds: ["{{.PY}} jev-demo pii-check --mode live -v {{.CLI_ARGS}}"]

  pii:demo:
    desc: Run the PII log check on the demo fixtures (leaky files block, clean files pass; needs API_KEY)
    deps: [setup]
    cmds:
      - 'echo "--- clean files: expect exit 0"'
      - "{{.PY}} jev-demo pii-check --mode live -v tests/fixtures/pii/clean_service.py tests/fixtures/pii/clean_worker.go"
      - 'echo "--- leaky files: expect BLOCK lines and exit 1"'
      - cmd: "{{.PY}} jev-demo pii-check --mode live tests/fixtures/pii/leaky_service.py tests/fixtures/pii/leaky_handler.ts"
        ignore_error: true

  browser:install:
    desc: Download the Chromium build Playwright expects (once per machine; skip if JEV_SWARM_CHROMIUM is set)
    deps: [setup]
    cmds: ["{{.PY}} playwright install chromium"]

  swarm:
    desc: "Adversarial e2e: 200 Jev-driven browser agents attack the portal. Replays cassettes, records new states. Exit 1 on new defects."
    deps: [setup]
    cmds: ["{{.PY}} jev-demo swarm --agents 200 {{.CLI_ARGS}}"]

  swarm:demo:
    desc: "The demo: same swarm, every known regression injected, replayed from cassettes (no key needed)"
    deps: [setup]
    env:
      JEV_DEMO_MODE: replay
    cmds: ["{{.PY}} jev-demo swarm --agents 200 --inject all --no-save {{.CLI_ARGS}}"]

  swarm:headed:
    desc: "Watch the swarm work: a few agents in visible Chromium windows, slowed down. task swarm:headed -- --inject all"
    deps: [setup]
    cmds:
      - "{{.PY}} jev-demo swarm --agents {{.AGENTS | default 4}} --concurrency {{.AGENTS | default 4}} --headed --slow-mo {{.SLOW_MO | default 400}} --no-save {{.CLI_ARGS}}"

  swarm:demo:headed:
    desc: "The demo in visible windows: 4 agents, every regression injected, replayed from cassettes (no key needed)"
    deps: [setup]
    env:
      JEV_DEMO_MODE: replay
    cmds:
      - "{{.PY}} jev-demo swarm --agents {{.AGENTS | default 4}} --concurrency {{.AGENTS | default 4}} --inject all --headed --slow-mo {{.SLOW_MO | default 400}} --no-save {{.CLI_ARGS}}"

  swarm:record:
    desc: Refresh the swarm cassettes and results/swarm for both the clean and injected portal (needs API_KEY)
    deps: [setup]
    preconditions:
      - sh: test -n "$API_KEY"
        msg: "API_KEY must be set (Vercel AI Gateway key)"
    env:
      JEV_DEMO_MODE: record
    cmds:
      - "{{.PY}} jev-demo swarm --agents 200 --inject all --quiet || true"
      - "{{.PY}} jev-demo swarm --agents 200 --quiet"

  swarm:live:
    desc: Run the swarm with every Jev call live, ignoring cassettes (needs API_KEY, costs cents)
    deps: [setup]
    env:
      JEV_DEMO_MODE: live
    cmds: ["{{.PY}} jev-demo swarm --agents 200 --no-save {{.CLI_ARGS}}"]

  hooks:install:
    desc: Install the pre-commit and pre-push hooks
    cmds:
      - uv tool run pre-commit install --hook-type pre-commit --hook-type pre-push
