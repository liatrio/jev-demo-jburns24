[project]
name = "jev-demo"
version = "0.1.0"
description = "Fraud-classification bake-off: TypeSafe Jev (System One) vs generative LLMs on synthetic bank transaction tapes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
jev-demo = "jev_demo.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_demo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tape runs judged by jev (replayed from cassettes by default)",
    "live: makes paid network calls; excluded unless JEV_DEMO_MODE=live",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
