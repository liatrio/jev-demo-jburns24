# Install with: task hooks:install   (or: uv tool run pre-commit install)
#
# Every hook here is offline and deterministic, with one deliberate exception:
# `pii-log-check` is a semantic lint that asks Jev, live, whether any staged log
# statement writes personal data. It needs API_KEY (read from .env), makes one
# call per changed file, and finishes in about a second for a fraction of a cent.
# Everything else replays recorded cassettes, so a commit takes seconds, not dollars.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-json
      - id: check-yaml
      - id: detect-private-key

  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: tapes-in-sync
        name: tapes match generators
        entry: uv run pytest tests/unit/test_tapes.py -q
        language: system
        pass_filenames: false
        files: ^(src/jev_demo/tapes\.py|tapes/.*\.json)$
      - id: unit-tests
        name: unit tests
        entry: uv run pytest tests/unit -q
        language: system
        pass_filenames: false
        files: ^(src/|tests/unit/)
      - id: e2e-jev-replay
        name: e2e (jev-driven, cassette replay)
        entry: env JEV_DEMO_MODE=replay uv run pytest tests/e2e -q
        language: system
        pass_filenames: false
        files: ^(src/|tests/|tapes/)
      - id: pii-log-check
        name: pii in log statements (jev, live)
        # Semantic lint. Receives only the staged source files; one Jev call per file.
        # Blocks the commit when a log line writes personal data. Needs API_KEY in .env.
        entry: uv run jev-demo pii-check --mode live
        language: system
        files: \.(py|js|mjs|cjs|ts|tsx|jsx|go|java|kt|kts|rs|rb|cs|scala|php|swift)$
        # The fixtures leak on purpose; the extractor tests quote leaky lines as strings.
        exclude: ^tests/(fixtures/pii/|unit/test_pii_extract\.py)
